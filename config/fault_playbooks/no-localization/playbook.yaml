version: 1
description: fault diagnosis playbook

playbooks:
  - id: no-localization
    title: 没有定位
    script:
      - name: check_lidar_stream
        tool_name: ros_topic_echo
        arguments:
          name: /livox/lidar
        assert_ref: rule_1
        on_fail:
          action: call_playbook
          playbook_id: lidar-no-data
          message: 激光没有数据，先转入激光链路排查
      - name: select_target_map_from_map_list
        tool_name: ros_service_call
        arguments:
          name: /zj_humanoid/navigation/get_map_list
        assert_ref: rule_2
        require_confirmation: true
        confirmation:
          when: after
          mode: select
          message: 请选择目标地图，你只要返回序号即可
          input:
            type: index
            placeholder: 请输入序号
            help_text: 请输入地图前面的序号
            auto_select_if_single: true
            options_source:
              field: output
              parser: string_list
              list_key: map_name_list
          output:
            store_as: target_map
            type: selected_option_value
        on_fail:
          action: stop
          message: 可用地图列表里没有目标地图，先补地图配置或检查地图发布
      - name: inspect_reloc_service
        tool_name: ros_service_definition
        arguments:
          type_name: naviai_localization_msgs/Lio
        assert_ref: rule_3
      - name: run_reloc_on_target_map
        tool_name: ros_service_call
        arguments:
          name: /zj_humanoid/perception/reloc
          request:
            method: auto
            map_path:
              from_context: target_map
            x_pos: 0.0
            y_pos: 0.0
            z_pos: 0.0
            x_ori: 0.0
            y_ori: 0.0
            z_ori: 0.0
            w_ori: 1.0
        assert_ref: rule_4
        require_confirmation: true
        confirmation:
          when: before
          mode: approve
          message: 即将执行重定位，是否继续？
          output:
            store_as: reloc_approved
            type: boolean
      - name: verify_odom_after_reloc
        tool_name: ros_topic_echo
        arguments:
          name: /zj_humanoid/navigation/odom_info
        assert_ref: rule_5
        on_fail:
          action: escalate
          message: 激光有数据且已经执行 reloc，但 odom_info 仍然全 0，转算法同事继续分析
    success_criteria:
      - name: confirm_odom_info_stable
        tool_name: ros_topic_echo
        arguments:
          name: /zj_humanoid/navigation/odom_info
        assert_ref: rule_5
        wait_seconds: 10
        confirm_times: 3
        on_fail:
          action: escalate
          message: odom_info 需要连续确认不再全 0，当前还不能判定定位彻底恢复
    escalation_notes:
      - "激光无数据时，先转激光链路问题，不要继续重复做重定位"
      - "激光有数据、已经执行 `/zj_humanoid/perception/reloc`，但 `/zj_humanoid/navigation/odom_info` 仍长期全 0，转算法同事继续分析"
      - "如果目标地图不在可用地图列表里，先补地图配置或检查地图发布"
      - "重定位需要人工确认，避免自动重定位影响现场任务"
    execution_notes:
      - "这是脚本化 playbook，不是自然语言排查说明"
      - "ROS 检查走 rosbridge"
      - "如果用户没有提供地图名，优先调用 `/zj_humanoid/navigation/get_map_list`，再让用户按序号选择地图"
      - "优先用 `/zj_humanoid/navigation/get_map_list` 和 `/zj_humanoid/navigation/get_cur_map_info` 确认目标地图状态"
      - "先看激光数据，再执行 `/zj_humanoid/perception/reloc`，最后看 `/zj_humanoid/navigation/odom_info`"

global_rules:
  - 没有明确模块名时，只读排查
  - 同一任务中最多执行一次自动恢复
  - 恢复失败后立即转人工
