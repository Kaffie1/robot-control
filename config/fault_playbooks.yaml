version: 1
description: initial fault diagnosis and recovery playbooks
notes:
  - playbook 中的短名工具在后端已兼容，优先按白名单执行，不要因为看到 ros_topic_info / ros_topic_echo 这类名称差异而停止后续排查。

playbooks:
  - id: topic-no-data
    title: Topic 无数据
    match_rules:
      keywords:
        - topic 无数据
        - 没有消息
        - 不发布
        - 订阅不到
      modules:
        - perception
        - navigation
        - sensor_lidar
    diagnosis_steps:
      - tool_name: ros_topic_info
        purpose: 确认 Topic 是否存在、类型是否正确、是否有发布者
      - tool_name: ros_topic_echo
        purpose: 抓取样本消息确认是否持续发布
      - tool_name: get_recent_task_logs
        purpose: 查看最近是否有部署或恢复导致状态变化
    recovery_steps:
      - tool_name: restart_module_service
        purpose: 在人工确认后重启对应模块
        require_confirmation: true

  - id: service-call-failed
    title: Service 调用失败
    match_rules:
      keywords:
        - service 调用失败
        - 接口超时
        - 无响应
    diagnosis_steps:
      - tool_name: ros_service_info
        purpose: 确认 Service 是否存在以及提供者信息
      - tool_name: ros_service_definition
        purpose: 查看 srv 参数定义，确认调用格式是否正确
      - tool_name: get_recent_task_logs
        purpose: 检查最近是否有相关模块重启或错误
    recovery_steps:
      - tool_name: restart_module_service
        purpose: 人工确认后重启相关模块服务
        require_confirmation: true

  - id: deploy-regression
    title: 部署后异常
    match_rules:
      keywords:
        - 部署后异常
        - 升级后异常
        - 回归问题
    diagnosis_steps:
      - tool_name: get_recent_task_logs
        purpose: 定位最近部署任务和错误日志
      - tool_name: export_orin_logs
        purpose: 导出部署时间窗口内的 ORIN 日志
    recovery_steps:
      - tool_name: run_history_rollback
        purpose: 人工确认后执行历史回滚
        require_confirmation: true

  - id: no-localization
    title: 没有定位
    match_rules:
      keywords:
        - 没有定位
        - 定位失败
        - 定位丢失
        - 无定位信息
        - map 不更新
    diagnosis_steps:
      - tool_name: ros_topic_info
        purpose: 通过 SSH 远端命令确认定位相关 topic 是否存在、是否有发布者
      - tool_name: ros_topic_echo
        purpose: 通过 SSH 远端命令抓取激光或定位相关 topic 样本，确认是否有数据输入
      - tool_name: read_remote_file
        purpose: 通过 SSH 远端读取地图配置或启动参数，检查是否已设置 D_floor 地图
      - tool_name: get_recent_task_logs
        purpose: 查看最近是否有部署、改图或重启导致定位状态变化
    recovery_steps: []
    escalation_notes:
      - 如果激光有数据且 D_floor 已正确设置，但仍然没有定位信息，停止自动排查并转算法同事继续分析
      - 如果激光没有数据，优先继续排查激光链路和对应模块
      - 如果 D_floor 未设置，先补齐地图配置再重新验证定位
    execution_examples:
      - step: 1
        tool_name: ros_echo_topic_once
        args:
          name: /livox/lidar
      - step: 2
        tool_name: ros_topic_info
        args:
          name: /zj_humanoid/navigation/odom_info
      - step: 3
        tool_name: final
        args:
          answer: |
            结论
            - 当前更像是定位输入链路或算法侧未收敛，不建议继续按 `/scan` 方向排查

            已确认
            - `/livox/lidar` 已恢复或存在数据
            - `/zj_humanoid/navigation/odom_info` 有输出
            - `D_floor` 已设置

            建议
            - 不要继续重复执行 ROS 基础连通性检查
            - 直接转算法同事排查定位算法链路

            转人工条件
            - 如果后续激光再次无数据，再回头检查 `sensor_lidar`
    execution_notes:
      - 所有 ROS 相关检查都应通过 rosbridge 工具执行，不要让模型自己拼接 execute_remote_command 去跑 ROS 命令
      - 只有读取普通配置文件、日志文件或主机级信息时，才考虑 execute_remote_command 或 read_remote_file
      - 这个案例不走 `/scan`，优先看 `/livox/lidar` 和 `/zj_humanoid/navigation/odom_info`

global_rules:
  - 没有明确模块名时，优先只读排查，不直接恢复
  - 同一任务中最多执行一次自动恢复
  - 一旦恢复动作失败，立即停止自动流程并提示人工接管
