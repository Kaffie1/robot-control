version: 1
description: robot fault diagnosis tool registry
notes:
  - 当前工具名已同时支持“推荐名”和“兼容别名”。文档中优先使用本文件列出的名称，后端也兼容若干常见短名，避免 playbook 和执行器命名不一致导致流程中断。

tool_groups:
  - id: read_only
    label: 只读排查
    description: 仅采集状态、日志和运行信息，不修改机器人状态
  - id: safe_write
    label: 安全恢复
    description: 可执行可逆或低风险恢复动作，默认需要人工确认
  - id: dangerous
    label: 高风险操作
    description: 可能引发业务中断或状态变更，必须人工确认

tools:
  - name: get_recent_task_logs
    title: 读取最近任务日志
    group: read_only
    require_confirmation: false
    timeout_seconds: 10
    description: 读取当前会话最近任务的执行日志，用于关联故障上下文
    args_schema:
      limit:
        type: integer
        required: false
        default: 3
        minimum: 1
        maximum: 10

  - name: export_orin_logs
    title: 导出 ORIN 日志
    group: read_only
    require_confirmation: false
    timeout_seconds: 120
    description: 按时间范围导出 ORIN 日志压缩包
    args_schema:
      module_names:
        type: string
        required: false
        description: 逗号分隔的模块名列表
      start_at:
        type: string
        required: true
        description: 格式 YYYY-MM-DD HH:MM:SS
      end_at:
        type: string
        required: true
        description: 格式 YYYY-MM-DD HH:MM:SS

  - name: export_pico_logs
    title: 导出 PICO 日志
    group: read_only
    require_confirmation: false
    timeout_seconds: 120
    description: 按时间范围导出 PICO 日志压缩包
    args_schema:
      start_at:
        type: string
        required: true
        description: 格式 YYYY-MM-DD HH:MM:SS
      end_at:
        type: string
        required: true
        description: 格式 YYYY-MM-DD HH:MM:SS

  - name: ros_topic_info
    title: 查询 Topic 信息
    group: read_only
    require_confirmation: false
    timeout_seconds: 20
    description: 查询指定 Topic 的发布者、订阅者和消息类型
    args_schema:
      name:
        type: string
        required: true

  - name: ros_topic_type
    title: 查询 Topic 类型
    group: read_only
    require_confirmation: false
    timeout_seconds: 20
    description: 查询指定 Topic 的消息类型
    args_schema:
      name:
        type: string
        required: true

  - name: ros_message_definition
    title: 读取消息定义
    group: read_only
    require_confirmation: false
    timeout_seconds: 20
    description: 读取指定消息类型的 msg 定义，优先显示源文件并展开嵌套结构
    args_schema:
      type_name:
        type: string
        required: true

  - name: ros_topic_echo
    title: 抓取 Topic 样本
    group: read_only
    require_confirmation: false
    timeout_seconds: 20
    description: 抓取指定 Topic 的一条消息样本，用于判断是否有数据发布
    args_schema:
      name:
        type: string
        required: true

  - name: ros_service_info
    title: 查询 Service 信息
    group: read_only
    require_confirmation: false
    timeout_seconds: 20
    description: 查询指定 Service 的提供者和请求类型
    args_schema:
      name:
        type: string
        required: true

  - name: ros_service_type
    title: 查询 Service 类型
    group: read_only
    require_confirmation: false
    timeout_seconds: 20
    description: 查询指定 Service 的 srv 类型
    args_schema:
      name:
        type: string
        required: true

  - name: ros_service_definition
    title: 读取服务定义
    group: read_only
    require_confirmation: false
    timeout_seconds: 20
    description: 读取指定服务类型的 srv 定义，优先显示源文件并展开嵌套结构
    args_schema:
      name:
        type: string
        required: true

  - name: ros_service_call
    title: 调用 Service
    group: safe_write
    require_confirmation: true
    timeout_seconds: 30
    description: 调用指定 ROS 服务，可能触发机器人状态变化
    args_schema:
      name:
        type: string
        required: true
      request:
        type: string
        required: false

  - name: restart_module_service
    title: 重启模块服务
    group: safe_write
    require_confirmation: true
    timeout_seconds: 60
    description: 重启单个 docker compose 模块服务
    args_schema:
      module_name:
        type: string
        required: true
        enum:
          - chassis
          - perception
          - sensor_lidar
          - navigation
          - map_server
          - nviz

  - name: run_history_rollback
    title: 执行历史回滚
    group: dangerous
    require_confirmation: true
    timeout_seconds: 300
    description: 基于历史记录执行回滚动作
    args_schema:
      history_id:
        type: integer
        required: true

execution_rules:
  allow_llm_direct_shell: false
  allow_cross_robot_execution: false
  require_connected_session: true
  max_auto_recovery_steps: 1
  default_mode: read_only
