<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Console</title>
  <link rel="stylesheet" href="/static/css/chat.css?v={{ asset_version }}" />
</head>

<body>
  <script>
    window.__CHAT_PLAYBOOK_ASSET_VERSION__ = "{{ asset_version }}";
  </script>
  <div class="chat-app">
    <header class="chat-header">
      <div>
        <h1>Agent Console</h1>
        <p>AI 故障助手</p>
      </div>

    </header>

    <main class="chat-main" id="chatMain">
      <section class="chat-panel">
        <div class="chat-panel-title">
          <div class="chat-panel-title-main">
            <span class="chat-step">01</span>
            <h2>聊天助手</h2>
          </div>
          <button id="playbookToggleBtn" type="button" class="playbook-toggle-btn" aria-expanded="true">关闭流程图</button>
        </div>

        <div class="chat-intro-card">
          <strong>先描述故障现象</strong>
          <p>系统会结合故障文档、工具列表和运行上下文，自动分析并匹配恢复流程。</p>
        </div>

        <div id="chatMessageList" class="chat-message-list">
          <div class="chat-empty-state">
            <strong>开始对话</strong>
            <p>你可以先描述一个故障现象，或者直接问机器人相关问题。</p>
          </div>
        </div>

        <form id="chatForm" class="chat-form">
          <label>
            <span class="chat-label">输入内容</span>
            <textarea
              id="chatInput"
              rows="5"
              placeholder="例如：底盘模块启动后没有速度反馈，帮我先分析可能原因"
            ></textarea>
          </label>

          <div class="chat-button-row">
            <button id="chatSubmitBtn" type="submit" class="chat-btn chat-btn-primary">发送</button>
            <button id="chatClearBtn" type="button" class="chat-btn chat-btn-ghost">清空对话</button>
          </div>
        </form>
      </section>

      <section id="playbookPanel" class="playbook-panel">
        <div class="playbook-panel-header">
          <div>
            <strong class="playbook-panel-title">流程图</strong>
            <p class="playbook-panel-subtitle">流程图面板常驻显示，命中后会立即更新内容。</p>
          </div>
        </div>
        <div class="playbook-stage-canvas">
          <div class="playbook-status-legend" aria-label="流程状态说明">
            <span class="playbook-status-chip unstarted">未执行</span>
            <span class="playbook-status-chip pending">执行中</span>
            <span class="playbook-status-chip success">成功</span>
            <span class="playbook-status-chip failed">失败</span>
            <span class="playbook-status-chip skipped">跳过</span>
          </div>
          <div class="playbook-zoom-controls" aria-label="流程图缩放控制">
            <button id="playbookZoomOutBtn" type="button" class="playbook-zoom-btn" aria-label="缩小流程图">-</button>
            <span id="playbookZoomValue" class="playbook-zoom-value">100%</span>
            <button id="playbookZoomInBtn" type="button" class="playbook-zoom-btn" aria-label="放大流程图">+</button>
            <button id="playbookZoomResetBtn" type="button" class="playbook-zoom-btn playbook-zoom-reset">重置</button>
          </div>
          <div id="playbookGraph" class="playbook-graph">
            <div class="playbook-empty">匹配到恢复流程后，这里会直接展示流程图。</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script defer src="/static/js/chat.js?v={{ asset_version }}"></script>
</body>
</html>
